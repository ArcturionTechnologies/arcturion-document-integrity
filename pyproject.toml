[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcturion-document-integrity-candidate"
version = "0.1.0"
description = "Compare saved PDF form values with a field map and plan"
requires-python = ">=3.10"
dependencies = ["pypdf>=3"]

[project.optional-dependencies]
examples = ["PyMuPDF>=1.24"]

[project.scripts]
document-integrity = "verify_form_fill:main"
docintegrity-stop = "stop_gate:main"

[tool.setuptools]
py-modules = ["verify_form_fill", "stop_gate"]
